[package]
name = "ionic-rs"
description = "Streamable binary format for mass-spectrometry data: lossless mzML conversion, random access, WebAssembly support"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ionic-rs"
readme = "../../README.md"
keywords = ["mzml", "wasm"]
categories = ["parser-implementations", "encoding", "wasm"]
include = ["src/**/*", "Cargo.toml", "LICENSE"]

[lib]
name = "ionic"

[dependencies]
serde = { workspace = true }
base64 = { workspace = true }
miniz_oxide = { workspace = true }
once_cell = { workspace = true }
quick-xml = { workspace = true }
serde_json = { workspace = true }
hashbrown = "0.17.1"
itoa = { workspace = true }
cosmoz = { workspace = true }
crc32fast = "1.5.2"
sha1 = "0.11"
bytemuck = "1"

[target.'cfg(not(all(target_arch = "wasm32", not(target_os = "wasi"))))'.dependencies]
rayon = { workspace = true }
memmap2 = "0.9"

[dev-dependencies]
proptest = "1"
