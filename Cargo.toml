[workspace]
members = ["crates/parser", "crates/cli", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.1"
license = "MIT"
authors = [
    "Javier Osorio M <javier.osorio.mosquera@gmail.com>",
    "Julien Wist <julien.wist@correounivalle.edu.co>",
    "Jorge Osorio M <joheosmo@gmail.com>"
]

[workspace.dependencies]
base64 = "0.22.1"
miniz_oxide = "0.9.1"
once_cell = "1.21.4"
quick-xml = "0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
clap = "4.6.1"
zstd = "0.13.3"
osmo = { git = "https://github.com/josoriom/osmo.git", rev = "bccc1d16805ac446e2c32294d69a0090a2b85181", default-features = false }
regex = "1.12.4"
rayon = "1.12.0"
itoa = "1.0"
